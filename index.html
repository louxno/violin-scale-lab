<style>

${items.length?`<div style="max-height:11rem;overflow:auto">${items.map((it,i)=>`<div class="li"><span>${ittl(it)}</span><button data-a="rm" data-i="${i}">${ic('x')}</button></div>`).join('')}</div>`:`<p class="mut ctr" style="padding:16px 0">${t('carnetEmpty')}</p>`}</div>
<button class="db k2" data-a="gen"${!items.length||busy?' disabled':''}>${ic('dl')} ${busy?t('generating'):t('generatePdf')}</button></div>`}
$('dlg').onclick=async e=>{if(e.target===$('dlg'))return $('dlg').hidden=true;const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a==='close')return $('dlg').hidden=true;
if(a==='cur')addIt({tn:S.tn,ty:S.ty,o:S.oct});else if(a==='oct')pOct=+b.dataset.o;else if(a==='clr')items=[];else if(a==='rm')items.splice(+b.dataset.i,1);
else if(a==='pre')TONICS.forEach(tn=>addIt({tn:tn.name,ty:b.dataset.k,o:pOct}));
else if(a==='gen'){if(!items.length)return;busy=true;dlg();try{await genCarnet();toast(`${t('carnetPdf')} ✓ (${items.length} ${t('scalesCount')})`)}catch(err){toast('PDF export failed')}busy=false}
dlg()};
$('car').onclick=dlg;
async function genCarnet(){const W=595,H=842,m=40,cw=W-m*2;let pg={texts:[{x:m,y:60,size:26,font:'F1',txt:pdfTxt(t('appName'))},{x:m,y:80,size:12,font:'F2',gray:.47,txt:lang==='fr'?'Carnet de gammes':'Scale notebook'}],imgs:[]};const pages=[pg];let y=104;
const host=document.createElement('div');host.style.cssText='position:absolute;left:-10000px;top:0;width:900px';document.body.appendChild(host);
try{for(const it of items){const tn=TONICS.find(x=>x.name===it.tn),ty=TYPES.find(x=>x.key===it.ty);if(!tn||!ty)continue;
const slot=document.createElement('div');slot.style.width='900px';host.appendChild(slot);
const res=renderScore(slot,{events:buildEvents(tn,ty,it.o),spec:keySpec(tn,ty),showF:S.fg,showK:S.ky,fing:getF(`${it.tn}-${it.ty}-${it.o}`),fmt:fmtOf(ty)});
if(!res||!res.svg){host.removeChild(slot);continue}
const im=await svgJpg(res.svg),dh=im.h*(cw/im.w);
if(y+22+dh+22>H-m){pg={texts:[],imgs:[]};pages.push(pg);y=m+10}
pg.texts.push({x:m,y,size:14,font:'F1',txt:pdfTxt(ttl(tn,ty,it.o))});y+=10;pg.imgs.push({...im,x:m,y,w:cw,h:dh});y+=dh+26;host.removeChild(slot)}}
finally{document.body.removeChild(host)}
await savePdf(makePdf(pages,W,H),(lang==='fr'?'carnet-gammes':'scale-notebook')+'.pdf')}

// ===== Tabs, language, init =====
const TABS=[['library','tab_library','music'],['tuner','tab_tuner','mic'],['dashboard','tab_dashboard','chart']];
function tabs(){$('dnav').innerHTML=TABS.map(([id,k,i])=>`<button data-tab="${id}" class="${S.tab===id?'on':''}">${ic(i)} ${t(k)}</button>`).join('');
$('mnav').innerHTML=TABS.map(([id,k,i])=>`<button data-tab="${id}" class="${S.tab===id?'on':''}">${ic(i)} ${t(k)}</button>`).join('')}
function goTab(id){S.tab=id;stopPlay();if(id!=='tuner'&&tu)tuStop();
$('v-lib').hidden=id!=='library';$('v-tun').hidden=id!=='tuner';$('v-dash').hidden=id!=='dashboard';
if(id==='tuner')tunerView();if(id==='dashboard')dashView();if(id==='library')draw();tabs();scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)goTab(b.dataset.tab)});
function applyLang(){document.documentElement.lang=lang;QA('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
QA('#lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));tabs();filters();setPlayBtn();sesBtn();beatsBtns();
if(S.tab==='tuner')tunerView();if(S.tab==='dashboard')dashView();if(!$('dlg').hidden)dlg();draw()}
$('lg').onclick=e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('bdg_lang',lang)}catch(x){}applyLang()};
paintBeats(-1);upStreak();applyLang();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
